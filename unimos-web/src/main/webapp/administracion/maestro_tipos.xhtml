<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>
        <center>

            <!-- Listar -->
            <h:form id="frmMaestroTipos">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{maestroTipoBean.modulo.descripcion}">#{maestroTipoBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{maestroTipoBean.accionListar}" title="Refrescar" ajax="false" actionListener="#{maestroTipoBean.refrescar}" icon="pi pi-sync" styleClass="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaWidget" var="obj" value="#{maestroTipoBean.lazyMaestroTipo}" rowKey="#{obj.tipo}"
                             rows="#{maestroTipoBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros" >

                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>    
                        <p:commandButton rendered="#{maestroTipoBean.accionVer}" title="Ver"   class="btn-icono" actionListener="#{maestroTipoBean.ver(obj.tipo)}" icon="pi pi-search"/>
                        <p:commandButton rendered="#{maestroTipoBean.accionEditar}" title="Editar"  class="btn-icono" actionListener="#{maestroTipoBean.editar(obj.tipo)}" icon="pi pi-pencil"/>
                    </p:column>
                    <p:column headerText="Código" filterBy="#{obj.tipo}" sortBy="#{obj.tipo}">
                        <f:facet name="filter">
                            <p:inputNumber label="Código" maxlength="4" thousandSeparator="" decimalPlaces="0" minValue="0" maxValue="9999" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.tipo}"/>
                    </p:column>
                    <p:column headerText="Padres">
                        <p:dataList value="#{obj.maestroTipo}" var="item" type="definition" style="width: 100%; text-align: left;" emptyMessage="">
                            <p:outputLabel value="&nbsp;#{item.tipo} - #{item.nombre}"/>
                        </p:dataList>
                    </p:column>
                    <p:column headerText="Nombre" filterBy="#{obj.nombre}" sortBy="#{obj.nombre}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" filter="true" filterMatchMode="contains" style="width: 90%;">
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{maestroTipoBean.listaMaestroTiposPadre}" var="tipo" itemValue="#{tipo.nombre}"  itemLabel="#{tipo.nombre}" itemDescription="#{tipo.nombre}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{obj.nombre}" title="#{obj.nombre}"/>
                    </p:column>
                    <p:column headerText="Perfil" filterBy="#{obj.perfil.nombre}">
                        <f:facet name="filter">
                            <p:inputText label="Perfil" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.perfil.nombre}" title="#{obj.perfil.descripcion}"/>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" class="btn-icono" styleClass="ui-confirmdialog-yes"   icon="pi pi-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" class="btn-icono" styleClass="ui-confirmdialog-no"  icon="pi pi-times" style="left:25%"/>
                </p:confirmDialog>
            </h:form>

            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="btnAuditoria" action="#{maestroTipoBean.getAuditoria(maestroTipoBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoría" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelVer" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor"
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo"/>
                                    <p:outputLabel value="#{maestroTipoBean.objeto.tipo}"/>
                                    <p:outputLabel value="Nombtre"/>
                                    <p:outputLabel value="#{maestroTipoBean.objeto.nombre}"/>
                                    <p:outputLabel value="Tipo Padre"/>
                                    <p:dataList value="#{maestroTipoBean.objeto.maestroTipo}" var="item" type="definition" style="width: 100%;">
                                        <p:outputLabel value="&nbsp;#{item.tipo} - #{item.nombre}"/>
                                    </p:dataList>
                                    <p:outputLabel value="Perfil"/>
                                    <p:outputLabel value="#{maestroTipoBean.objeto.perfil.nombre}" title="#{maestroTipoBean.objeto.perfil.descripcion}" />
                                    <p:outputLabel value="Activo"/>
                                    <p:outputLabel value="#{maestroTipoBean.objeto.activoStr}" />
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton btn-salir"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" width="70%">
                <h:form class="frmAuditoria" style="margin-top: 0px;
                        text-align: right;">
                    <p:commandButton id="auditoria" class="btnAuditoria" action="#{maestroTipoBean.getAuditoria(maestroTipoBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoría" />
                </h:form>
                <h:form id="frmEditar">
                    <p:panelGrid id="panelEditar">
                        <p:row>
                            <p:column class="ui-g-2">
                                <p:outputLabel value="Tipo" style="font-weight:bold"/>
                            </p:column>
                            <p:column class="ui-g-4">
                                <h:outputText value="#{maestroTipoBean.objeto.tipo}" />
                            </p:column>
                            <p:column class="ui-g-2">
                                <p:outputLabel value="Nombre" style="font-weight:bold"/>
                            </p:column>
                            <p:column class="ui-g-4">
                                <h:outputText value="#{maestroTipoBean.objeto.nombre}" title="#{maestroTipoBean.objeto.nombre}"/>
                            </p:column>
                        </p:row>
                        <p:row>
                            <p:column class="ui-g-2">
                                <p:outputLabel value="Tipo Padre" for="tipoPadre" style="font-weight:bold"/>
                            </p:column>
                            <p:column class="ui-g-4">
                                <p:selectCheckboxMenu style="width: 250px;" id="tipoPadre" value="#{maestroTipoBean.selectedMaestrosPadres}" label="Perfiles" 
                                                      filter="true" filterMatchMode="contains" panelStyle="width:250px" >
                                    <f:selectItems value="#{maestroTipoBean.listaMaestroTiposPadre}" var="padre" itemValue="#{padre.tipo}" itemLabel="#{padre.tipo} - #{padre.nombre}" itemDescription="#{padre.tipo} - #{padre.nombre}"   />
                                </p:selectCheckboxMenu>
                            </p:column>
                            <p:column class="ui-g-2">
                                <p:outputLabel value="Perfil" for="perfil" style="font-weight:bold"/>
                            </p:column>
                            <p:column class="ui-g-4">
                                <p:selectOneMenu id="perfil" label="Perfil" value="#{maestroTipoBean.objeto.perfil.id}" filter="true" filterMatchMode="contains" editable="fase">
                                    <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{maestroTipoBean.listaPerfiles}" var="per" itemValue="#{per.id}"  itemLabel="#{per.nombre}" itemDescription="#{per.descripcion}"/>
                                </p:selectOneMenu>
                            </p:column>
                        </p:row>
                        <f:facet name="footer" >
                            <p:commandButton value="Modificar" class="btn-icono"  type="button" onclick="modificarRemote()" validateClient="true" style="width: auto"/>
                            <p:remoteCommand name="modificarRemote" action="#{maestroTipoBean.modificar}" update="panelEditar" />
                            <p:commandButton  value="Cancelar" class="btn-icono"  type="button" onclick="PF('dialogoEditar').hide()" immediate="true" style="width: auto"/>
                        </f:facet>
                    </p:panelGrid>
                </h:form>
            </p:dialog>
        </center>
    </ui:define>
</ui:composition>
