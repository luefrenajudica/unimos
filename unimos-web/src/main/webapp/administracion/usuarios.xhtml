<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>
        <center>
            
            <!-- Listar -->
            <h:form id="frmUsuarios">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{usuarioBean.modulo.descripcion}">#{usuarioBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{usuarioBean.accionListar}" title="Refrescar" ajax="false" actionListener="#{usuarioBean.refrescar}" icon="pi pi-sync" styleClass="boton-normal btn1"/>
                        <p:commandButton rendered="#{usuarioBean.accionCrear}" title="Crear" actionListener="#{usuarioBean.crear}" icon="pi pi-file-o" styleClass="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaWidget" var="obj" value="#{usuarioBean.lazyUsuario}" rowKey="#{obj.id}"
                             rows="#{usuarioBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros" >
                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>    
                        <p:commandButton rendered="#{usuarioBean.accionVer}" title="Ver" actionListener="#{usuarioBean.ver(obj.id)}" icon="pi pi-search" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{usuarioBean.accionEditar}" title="Editar" actionListener="#{usuarioBean.editar(obj.id)}" icon="pi pi-pencil" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{usuarioBean.accionAdicional1}" title="Restaurar Contraseña" action="#{usuarioBean.restaurarContrasena(obj.id)}" icon="pi pi-unlock " class="boton-normal btn1">
                            <p:confirm header="Confirmación" message="Está seguro que desea restaurar la contraseña para este usuario?" icon="ui-icon-alert" />
                        </p:commandButton>
                        <p:commandButton rendered="#{usuarioBean.accionBorrar}" title="Borrar" action="#{usuarioBean.borrar(obj.id)}" icon="pi pi-trash" class="boton-normal btn1">
                            <p:confirm header="Confirmación" message="Está seguro que desea eliminar?" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                    <p:column headerText="Usuario" sortBy="#{obj.usuario}" filterBy="#{obj.usuario}">
                        <f:facet name="filter">
                            <p:inputText label="Usuario" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.usuario}"/>
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{obj.nombre}" filterBy="#{obj.nombre}">
                        <f:facet name="filter">
                            <p:inputText label="Nombre" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.nombre}"/>
                    </p:column>
                    <p:column headerText="Correo Electrónico" sortBy="#{obj.correoElectronico}" filterBy="#{obj.correoElectronico}">
                        <f:facet name="filter">
                            <p:inputText label="Correo Electrónico" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.correoElectronico}"/>
                    </p:column>
                    <p:column headerText="Activo" filterBy="#{obj.activo}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" >
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="SI" itemValue="true" />
                                <f:selectItem itemLabel="NO" itemValue="false" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{obj.activoStr}"/>
                    </p:column>
                    <p:column headerText="Roles">                        
                        <p:dataList value="#{obj.listaRoles}" var="rr" type="ordered" style="width: 100%;">
                            <p:outputLabel title="#{rr.rol.descripcion}" value="#{rr.rol.nombre}"/>
                        </p:dataList>
                    </p:column>
                    <p:column headerText="F.H. Crea" sortBy="#{obj.fechaHoraCrea}">                        
                        <h:outputText value="#{obj.fechaHoraCrea}">
                            <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="F.H. Ingreso" sortBy="#{obj.fechaUltimoIngreso}">                        
                        <h:outputText value="#{obj.fechaUltimoIngreso}">
                            <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" style="left:25%"/>
                </p:confirmDialog>
            </h:form>
            
            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="boton-normal btn1" action="#{usuarioBean.getAuditoria(usuarioBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoria" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelVer" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor"
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Usuario"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.usuario}"/>
                                    <p:outputLabel value="Activo"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.activoStr}"/>
                                    <p:outputLabel value="Nombre"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.nombre}"/>
                                    <p:outputLabel value="Correo Electrónico"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.correoElectronico}"/>
                                    <p:outputLabel value="Telefono"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.telefono}"/>
                                    <p:outputLabel value="Celular"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.celular}"/>
                                    <p:outputLabel value="Creación"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.fechaHoraCrea}">
                                        <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                                    </p:outputLabel>
                                    <p:outputLabel value="Ultimo Ingreso"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.fechaUltimoIngreso}">
                                        <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                                    </p:outputLabel>
                                    <p:outputLabel value="Roles"/>
                                    <p:dataList value="#{usuarioBean.objeto.listaRoles}" var="rol" type="ordered" style="width: 100%;">
                                        #{rol.rol.nombre}
                                    </p:dataList>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton btn-salir"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>
            
            <!-- Crear -->
            <!--<p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" width="80%">-->
            <p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form id="frmCrear">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrear" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelCrear" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Usuario" for="usuario"/>
                                    <p:inputText id="usuario" label="Usuario" value="#{usuarioBean.objeto.usuario}" maxlength="12" required="true" style="width: 99%"/>
                                    <p:outputLabel value="Activo" for="activo"/>
                                    <p:selectOneRadio id="activo" value="#{usuarioBean.objeto.activo}">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>
                                    <p:outputLabel value="Nombre" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" value="#{usuarioBean.objeto.nombre}" maxlength="128" required="true" style="width: 99%"/>

                                    <p:outputLabel value="Correo Electrónico" for="correoElectronico"/>

                                    <p:inputText id="correoElectronico" label="Correo Electrónico" value="#{usuarioBean.objeto.correoElectronico}" maxlength="128" required="true" style="width: 100%">
                                        <f:validator validatorId="validarCorreo"/>
                                    </p:inputText>                            
                                    <p:outputLabel value="Celular" for="celular" />
                                    <p:inputText id="celular" label="Celular" value="#{usuarioBean.objeto.celular}" maxlength="16" style="width: 99%"/>                            
                                    <p:outputLabel value="Telefono" for="telefono" />
                                    <p:inputText id="telefono" label="Telefono" value="#{usuarioBean.objeto.telefono}" maxlength="16" style="width: 99%"/>                        
                                    <p:outputLabel value="Creación"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.fechaHoraCrea}">
                                        <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                                    </p:outputLabel>
                                    <p:outputLabel value="Ultimo Ingreso"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.fechaUltimoIngreso}">
                                        <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                                    </p:outputLabel>
                                    <p:outputLabel value="Roles" for="roles"/>
                                    <p:selectCheckboxMenu id="roles" value="#{usuarioBean.seleccionRoles}" label="Roles" multiple="true"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width:250px" style="width: 99%">
                                        <f:selectItems value="#{usuarioBean.listaRoles}" var="rol" itemValue="#{rol.id}"  itemLabel="#{rol.nombre}" itemDescription="#{rol.descripcion}"   />
                                    </p:selectCheckboxMenu>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrear" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Guardar" type="button" onclick="guardarRemote()" validateClient="true" styleClass="btn-guardar"/>
                                        <p:remoteCommand name="guardarRemote" action ="#{usuarioBean.guardar}" update="panelCrear"/>
                                        <p:commandButton value="Cancelar" type="button" onclick="PF('dialogoCrear').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>
            
            <!-- Editar -->
            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmEditar">
                        <p:scrollPanel mode="native">
                            <p:panel id="pEditar" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelEditar" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Usuario" for="usuario" />
                                    <p:inputText id="usuario" label="Usuario" value="#{usuarioBean.objeto.usuario}" maxlength="12" required="true" style="width:99%"/>
                                    <p:outputLabel value="Activo" for="activo"/>
                                    <p:selectOneRadio id="activo" value="#{usuarioBean.objeto.activo}">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>
                                    <p:outputLabel value="Nombre" for="nombre" />
                                    <p:inputText id="nombre" label="Nombre" value="#{usuarioBean.objeto.nombre}" maxlength="128" required="true" style="width: 99%"/>

                                    <p:outputLabel value="Correo Electrónico" for="correoElectronico" />

                                    <p:inputText id="correoElectronico" label="Correo Electrónico" value="#{usuarioBean.objeto.correoElectronico}" maxlength="128" required="true" style="width: 99%">
                                        <f:validator validatorId="validarCorreo"/>
                                    </p:inputText>
                                    <p:outputLabel value="Celular" for="celular"/>
                                    <p:inputText id="celular" label="Celular" value="#{usuarioBean.objeto.celular}" maxlength="16" style="width: 99%"/>
                                    <p:outputLabel value="Telefono" for="telefono"/>

                                    <p:inputText id="telefono" label="Telefono" value="#{usuarioBean.objeto.telefono}" maxlength="16" style="width: 99%"/>

                                    <p:outputLabel value="Creación"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.fechaHoraCrea}">
                                        <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                                    </p:outputLabel>
                                    <p:outputLabel value="Ultimo Ingreso"/>
                                    <p:outputLabel value="#{usuarioBean.objeto.fechaUltimoIngreso}">
                                        <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                                    </p:outputLabel>
                                    <p:outputLabel value="Roles" for="roles"/>
                                    <p:selectCheckboxMenu id="roles" value="#{usuarioBean.seleccionRoles}" label="Roles" multiple="true"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width:250px" style="width: 99%">
                                        <f:selectItems value="#{usuarioBean.listaRoles}" var="rol" itemValue="#{rol.id}"  itemLabel="#{rol.nombre}" itemDescription="#{rol.descripcion}"   />
                                    </p:selectCheckboxMenu>                                    
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesEditar" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Modificar" type="button" class="boton btn-azul"   onclick="modificarRemote()" validateClient="true" styleClass="btn-modificar" />
                                    <p:remoteCommand name="modificarRemote" action="#{usuarioBean.modificar}" update="panelEditar" />
                                    <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoEditar').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>
            
        </center>
    </ui:define>
</ui:composition>
