<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>
        <center>

            <!-- Listar -->
            <h:form id="frmMaestros">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{maestroBean.modulo.descripcion}">#{maestroBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{maestroBean.accionListar}" title="Refrescar" ajax="false" actionListener="#{maestroBean.refrescar()}" icon="pi pi-sync" styleClass="boton-normal btn1"/>
                        <p:commandButton rendered="#{maestroBean.accionCrear}" title="Crear" actionListener="#{maestroBean.crear()}" icon="pi pi-file-o" styleClass="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaWidget" var="obj" value="#{maestroBean.lazyMaestro}" rowKey="#{obj.id}"
                             rows="#{maestroBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros">
                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>    
                        <p:commandButton rendered="#{maestroBean.accionVer}" title="Ver" actionListener="#{maestroBean.ver(obj.id)}" icon="pi pi-search" class="boton-normal btn1" />
                        <p:commandButton rendered="#{maestroBean.accionEditar}" title="Editar" actionListener="#{maestroBean.editar(obj.id)}" icon="pi pi-pencil" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{maestroBean.accionBorrar}" title="Borrar" action="#{maestroBean.borrar(obj.id)}" icon="pi pi-trash" class="boton-normal btn1" >
                            <p:confirm header="Confirmación" message="Está seguro que desea eliminar?" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                    <p:column headerText="Tipo" filterBy="#{obj.maestroTipo.tipo}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" filter="true" filterMatchMode="contains" style="width: 90%;">
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{maestroBean.listaTipoMaestros}" var="tipo" itemValue="#{tipo.tipo}"  itemLabel="#{tipo.nombre}" itemDescription="#{tipo.nombre}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{maestroBean.getNombreTipo(obj.maestroTipo.tipo)}"/>
                    </p:column>
                    <p:column headerText="Nombre" filterBy="#{obj.nombre}" sortBy="#{obj.nombre}">
                        <f:facet name="filter">
                            <p:inputText label="Nombre" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.nombre}" title="#{obj.descripcion}"/>
                    </p:column>
                    <p:column headerText="Valor" filterBy="#{obj.valor}" sortBy="#{obj.valor}">
                        <f:facet name="filter">
                            <p:inputText label="Valor" maxlength="8" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.valor}" title="#{obj.valor}"/>
                    </p:column>
                    <p:column headerText="Activo" filterBy="#{obj.activo}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" >
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="SI" itemValue="true" />
                                <f:selectItem itemLabel="NO" itemValue="false" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{obj.activoStr}"/>
                    </p:column>
                    <p:column headerText="F.H. Crea" sortBy="#{obj.fechaHoraCrea}">                        
                        <h:outputText value="#{obj.fechaHoraCrea}">
                            <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" style="left:25%"/>
                </p:confirmDialog>
            </h:form>

            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="boton-normal btn1" action="#{maestroBean.getAuditoria(maestroBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoria" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelVer" columns="2" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor"
                                             columnClasses="ui-grid-col-4 col-etiqueta, ui-grid-col-8 col-campo">

                                    <p:outputLabel value="Tipo" style="font-weight:bold"/>                        
                                    <h:outputText value="#{maestroBean.getNombreTipo(maestroBean.objeto.maestroTipo.tipo)}" />
                                    <p:outputLabel value="Nombre" style="font-weight:bold"/>                        
                                    <h:outputText value="#{maestroBean.objeto.nombre}" title="#{maestroBean.objeto.descripcion}" />
                                    <p:outputLabel value="Valor" style="font-weight:bold"/>                            
                                    <h:outputText value="#{maestroBean.objeto.valor}" title="#{maestroBean.objeto.valor}" />                           
                                    <p:outputLabel value="Dependiencia" style="font-weight:bold"/>                            

                                    <p:outputPanel style="padding:0 !important; border-left: none !important;">
                                        <p:dataTable var="maestroTipo" value="#{maestroBean.listaMaestroTipoRelacion}" reflow="true" >
                                            <p:column headerText="Tipo id"  >
                                                <p:outputLabel value="#{maestroTipo.maestroTipoPadre.tipo}"/>
                                            </p:column>
                                            <p:column headerText="Tipo Maestros Padre"  >
                                                <p:outputLabel value="#{ maestroTipo.maestroTipoPadre.nombre}"/>
                                            </p:column>
                                            <p:column headerText="Maestros Padre"  >
                                                <ul>
                                                    <ui:repeat value="#{maestroTipo.maestros}" var="item">
                                                        <li><h:outputText value="#{item.nombre}"/></li>
                                                    </ui:repeat>
                                                </ul>
                                            </p:column>
                                        </p:dataTable>
                                    </p:outputPanel>

                                    <p:outputLabel value="Acciones" style="font-weight:bold"/>                            
                                    <p:dataList value="#{maestroBean.objeto.maestroAcciones}" var="accion" type="ordered">
                                        <h:outputText value="#{accion.nombre}" title="#{accion.descripcion}" />
                                    </p:dataList>                            
                                    <p:outputLabel value="Activo" style="font-weight:bold"/>                            
                                    <h:outputText value="#{maestroBean.objeto.activoStr}" />                            
                                    <p:outputLabel value="Descripción" style="font-weight:bold"/>                            
                                    <h:outputText value="#{maestroBean.objeto.descripcion}" />

                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" class="boton-normal btn1" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton-normal btn1"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Crear -->
            <p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form id="frmCrear">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrear" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelCrear" columns="2" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-4 col-etiqueta, ui-grid-col-8 col-campo">
                                    <p:outputLabel value="Tipo" for="tipo" />
                                    <p:selectOneMenu id="tipo" label="Tipo" value="#{maestroBean.objeto.maestroTipo.tipo}" filter="true" filterMatchMode="contains" required="true" editable="fase">
                                        <p:ajax event="change" listener="#{maestroBean.listarDependencias}" update="tipoPadre, dependenciaLabel, acciones" />
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{maestroBean.listaTipoMaestros}" var="tipo" itemValue="#{tipo.tipo}"  itemLabel="#{tipo.nombre}" itemDescription="#{tipo.nombre}"/>
                                    </p:selectOneMenu> 
                                    <p:outputLabel value="Nombre" for="nombre" />
                                    <p:inputText id="nombre" label="Nombre" value="#{maestroBean.objeto.nombre}" maxlength="128" required="true"/>
                                    <p:outputLabel value="Valor" for="valor" />
                                    <p:inputText id="valor" label="Valor" value="#{maestroBean.objeto.valor}" maxlength="8" required="true" />

                                    <p:outputLabel id="dependenciaLabel" value="Dependiencia" for="tipoPadre"/>
                                    <p:selectCheckboxMenu id="tipoPadre" value="#{maestroBean.selectedMaestrosPadres}" label="Perfiles" 
                                                          filter="true" filterMatchMode="contains" >
                                        <f:selectItems value="#{maestroBean.listaMaestroTiposPadre}" var="padre" itemValue="#{padre.tipo}"  itemLabel="#{padre.nombre}" itemDescription="#{padre.nombre}"   />
                                    </p:selectCheckboxMenu>

                                    <p:outputLabel value="Acciones" for="acciones" />
                                    <p:selectCheckboxMenu id="acciones" label="Acciones" value="#{maestroBean.selectMaestroAcciones}" filter="true" filterMatchMode="contains" >
                                        <f:selectItems value="#{maestroBean.listaAcciones}" var="acc" itemValue="#{acc.id}" itemLabel="#{acc.nombre}" itemDescription="#{acc.descripcion}" />
                                    </p:selectCheckboxMenu>

                                    <p:outputLabel value="Activo" for="activo" />
                                    <p:selectOneRadio id="activo" value="#{maestroBean.objeto.activo}">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>
                                    <p:outputLabel value="Descripción" for="descripcion" />
                                    <p:inputTextarea id="descripcion" label="Descripción" value="#{maestroBean.objeto.descripcion}" cols="50" maxlength="512" />
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrear" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Guardar" type="button" class="boton btn-azul" onclick="guardarRemote()" validateClient="true" styleClass="btn-guardar" />
                                        <p:remoteCommand name="guardarRemote" action ="#{maestroBean.guardar}" update="panelCrear"/>
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoCrear').hide()" immediate="true" styleClass="btn-cancelar" />
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Editar -->
            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmEditar">
                        <p:scrollPanel mode="native">
                            <p:panel id="pEditar" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelEditar" columns="2" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-4 col-etiqueta, ui-grid-col-8 col-campo">

                                    <p:outputLabel value="Tipo"/>
                                    <h:outputText value="#{maestroBean.getNombreTipo(maestroBean.objeto.maestroTipo)}" />
                                    <p:outputLabel value="Nombre" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" value="#{maestroBean.objeto.nombre}" size="60" maxlength="128" required="true">
                                    </p:inputText>
                                    <p:outputLabel value="Valor"/>
                                    <p:outputLabel value="#{maestroBean.objeto.valor}"/>
                                    <p:outputLabel value="Dependiencia"/>
                                    <p:dataTable var="maestroTipo" value="#{maestroBean.listaMaestroTipoRelacion}" editable="true" widgetVar="tablaPermisosWidget" >
                                        <p:ajax event="rowEdit" listener="#{perfilBean.modificarPermiso}"/>
                                        <p:column headerText="Tipo Padre" >
                                            <p:cellEditor>
                                                <f:facet name="output">
                                                    <h:outputText value="#{maestroTipo.maestroTipoPadre.tipo} (#{maestroTipo.maestroTipoPadre.nombre})" title="#{maestroTipo.maestroTipoPadre.nombre}"/>
                                                </f:facet>
                                                <f:facet name="input">
                                                    <h:outputText value="#{maestroTipo.maestroTipoPadre.tipo} (#{maestroTipo.maestroTipoPadre.nombre})" title="#{maestroTipo.maestroTipoPadre.nombre}"/>
                                                </f:facet>
                                            </p:cellEditor>
                                        </p:column>
                                        <p:column headerText="Maestros Padre" >
                                            <p:selectCheckboxMenu id="tipoHijos" value="#{maestroTipo.seleccion}" label="Maestros"
                                                                  filter="true" filterMatchMode="contains">
                                                <f:selectItems value="#{maestroTipo.maestros}" var="maestro" itemValue="#{maestro.id}" 
                                                               itemLabel="#{maestro.nombre}" itemDescription="#{maestro.descripcion}"   />
                                            </p:selectCheckboxMenu>
                                        </p:column>
                                    </p:dataTable>
                                    <p:outputLabel value="Acciones" for="acciones"/>
                                    <p:selectCheckboxMenu id="acciones" label="Acciones" value="#{maestroBean.selectMaestroAcciones}" filter="true" filterMatchMode="contains" panelStyle="height: 200px">
                                        <f:selectItems value="#{maestroBean.listaAcciones}" var="acc" itemValue="#{acc.id}" itemLabel="#{acc.nombre}" itemDescription="#{acc.descripcion}" />
                                    </p:selectCheckboxMenu>
                                    <p:outputLabel value="Activo" for="activo"/>
                                    <p:selectOneRadio id="activo" value="#{maestroBean.objeto.activo}">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>
                                    <p:outputLabel value="Descripcion" for="descripcion"/>
                                    <p:inputTextarea id="descripcion" label="Agrupación" value="#{maestroBean.objeto.descripcion}" cols="50" maxlength="512" />
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesEditar" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Modificar" type="button" class="boton btn-azul"   onclick="modificarRemote()" validateClient="true" styleClass="btn-modificar"/>
                                        <p:remoteCommand name="modificarRemote" action="#{maestroBean.modificar}" update="panelEditar" />
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoEditar').hide()" immediate="true" styleClass="btn-cancelar" />
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

        </center>
    </ui:define>
</ui:composition>
