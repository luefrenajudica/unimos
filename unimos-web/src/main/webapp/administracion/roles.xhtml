<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>
        <center>
            <!-- Listar -->
            <h:form id="frmRols">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{rolBean.modulo.descripcion}">#{rolBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{rolBean.accionListar}" title="Refrescar" ajax="false" actionListener="#{rolBean.refrescar}" icon="pi pi-sync" styleClass="boton-normal btn1"/>
                        <p:commandButton rendered="#{rolBean.accionCrear}" title="Crear" actionListener="#{rolBean.crear}" icon="pi pi-file-o" styleClass="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaWidget" var="obj" value="#{rolBean.lazyRol}" rowKey="#{obj.id}"
                             rows="#{rolBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros" >
                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>    
                        <p:commandButton rendered="#{rolBean.accionVer}" title="Ver" actionListener="#{rolBean.ver(obj.id)}" icon="pi pi-search" class="boton-normal btn1"  />
                        <p:commandButton rendered="#{rolBean.accionEditar}" title="Editar" actionListener="#{rolBean.editar(obj.id)}" icon="pi pi-pencil" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{rolBean.accionAdicional1}" title="Restaurar Contraseña" action="#{rolBean.restaurarContrasena(obj.id)}" icon="ui-icon-unlocked">
                            <p:confirm header="Confirmación" message="Está seguro que desea restaurar la contraseña para este usuario?" icon="ui-icon-alert" />
                        </p:commandButton>
                        <p:commandButton rendered="#{rolBean.accionBorrar}" title="Borrar" action="#{rolBean.borrar(obj.id)}" icon="pi pi-trash" class="boton-normal btn1">
                            <p:confirm header="Confirmación" message="Está seguro que desea eliminar?" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{obj.nombre}" filterBy="#{obj.nombre}">
                        <f:facet name="filter">
                            <p:inputText label="Nombre" maxlength="16" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.nombre}"/>
                    </p:column>

                    <p:column headerText="Descripción" sortBy="#{obj.descripcion}" filterBy="#{obj.descripcion}">
                        <f:facet name="filter">
                            <p:inputText label="Descripción" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.descripcion}"/>
                    </p:column>

                    <p:column headerText="Activo" filterBy="#{obj.activo}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" >
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="SI" itemValue="true" />
                                <f:selectItem itemLabel="NO" itemValue="false" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{obj.activoStr}"/>
                    </p:column>

                    <p:column headerText="F.H. Crea" sortBy="#{obj.fechaHoraCrea}">                        
                        <h:outputText value="#{obj.fechaHoraCrea}">
                            <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" style="left:25%"/>
                </p:confirmDialog>
            </h:form>
            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="boton-normal btn1" action="#{rolBean.getAuditoria(rolBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoria" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelVer" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor"
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Nombre"/>
                                    <p:outputLabel value="#{rolBean.objeto.nombre}"/>
                                    <p:outputLabel value="Activo"/>
                                    <p:outputLabel value="#{rolBean.objeto.activoStr}"/>
                                    <p:outputLabel value="Descripción"/>
                                    <p:outputLabel value="#{rolBean.objeto.descripcion}"/>
                                    <p:outputLabel value="Perfiles"/>
                                    <p:dataList value="#{rolBean.objeto.rolesPerfilesList}" var="perf" type="ordered" style="width: 99%">
                                        #{perf.perfiles.nombre}
                                    </p:dataList>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton btn-salir"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>
            <!-- Crear -->
            <p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmCrear">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrear" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelCrear" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Nombre" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" value="#{rolBean.objeto.nombre}" size="60" maxlength="16" required="true" style="width: 99%"/>
                                    <p:outputLabel value="Activo" for="activo"/>
                                    <p:selectOneRadio id="activo" value="#{rolBean.objeto.activo}">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>
                                    <p:outputLabel value="Descripción" for="descripcion"/>
                                    <p:inputText id="descripcion" label="Descripción" value="#{rolBean.objeto.descripcion}" size="60" maxlength="128" required="true" style="width: 99%"/>
                                    <p:outputLabel value="Perfiles" for="perfiles"/>
                                    <p:selectCheckboxMenu id="perfiles" value="#{rolBean.selectedPerfiles}" label="Perfiles" multiple="true"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width:250px" style="width: 99%">
                                        <f:selectItems value="#{rolBean.perfilesList}" var="perf" itemValue="#{perf.id}"  itemLabel="#{perf.nombre}" itemDescription="#{perf.descripcion}"   />
                                    </p:selectCheckboxMenu>

                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrear" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Guardar" type="button" class="boton btn-azul" onclick="guardarRemote()" validateClient="true" styleClass="btn-guardar"  />
                                        <p:remoteCommand name="guardarRemote" action ="#{rolBean.guardar}" update="panelCrear"/>
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoCrear').hide()" immediate="true" styleClass="btn-cancelar" />
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Editar -->
            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmEditar">
                        <p:scrollPanel mode="native">
                            <p:panel id="pEditar" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelEditar" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Nombre" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" value="#{rolBean.objeto.nombre}" size="60" maxlength="16" required="true" style="width: 99%"/>
                                    <p:outputLabel value="Activo" for="activo"/>
                                    <p:selectOneRadio id="activo" value="#{rolBean.objeto.activo}">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>
                                    <p:outputLabel value="Descripción" for="descripcion"/>
                                    <p:inputText id="descripcion" label="Descripción" value="#{rolBean.objeto.descripcion}" size="60" maxlength="128" required="true" style="width: 99%"/>
                                    <p:outputLabel value="Perfiles" for="perfiles"/>
                                    <p:selectCheckboxMenu id="perfiles" value="#{rolBean.selectedPerfiles}" label="Perfiles" multiple="true"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width:250px" style="width: 99%">
                                        <f:selectItems value="#{rolBean.perfilesList}" var="perf" itemValue="#{perf.id}"  itemLabel="#{perf.nombre}" itemDescription="#{perf.descripcion}"   />
                                    </p:selectCheckboxMenu>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesEditar" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Modificar" type="button" class="boton btn-azul"   onclick="modificarRemote()" validateClient="true" styleClass="btn-modificar"/>
                                        <p:remoteCommand name="modificarRemote" action="#{rolBean.modificar}" update="panelEditar" />
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoEditar').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>
        </center>
    </ui:define>
</ui:composition>
