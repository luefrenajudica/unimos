<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>
        <center>

            <!-- Listar -->
            <h:form id="frmUbicaciones">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{ubicacionBean.modulo.descripcion}">#{ubicacionBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{ubicacionBean.accionListar}" title="Refrescar" ajax="false" action="#{ubicacionBean.refrescar}"  icon="pi pi-sync" styleClass="boton-normal btn1"/>
                        <p:commandButton rendered="#{ubicacionBean.accionCrear}" title="Crear" actionListener="#{ubicacionBean.crear}" icon="pi pi-file-o" styleClass="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaWidget" var="obj" value="#{ubicacionBean.lazyUbicacion}" rowKey="#{obj.id}"
                             rows="#{ubicacionBean.tamanoPagina}" paginator="true" lazy="true" reflow="true"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros" style=" background:  #f1f5f8;" styleClass="tablaNueva" >
                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>
                        <p:commandButton rendered="#{ubicacionBean.accionVer}" title="Ver" actionListener="#{ubicacionBean.ver(obj.id)}" icon="pi pi-search" class="boton-normal btn1" />
                        <p:commandButton rendered="#{ubicacionBean.accionEditar}" title="Editar" actionListener="#{ubicacionBean.editar(obj)}" icon="pi pi-pencil" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{ubicacionBean.accionBorrar}" title="Borrar" action="#{ubicacionBean.borrar(obj)}" icon="pi pi-trash" class="boton-normal btn1" >
                            <p:confirm header="Confirmación" message="¿Está seguro que desea eliminar?" icon="pi pi-exclamation-circle" />
                        </p:commandButton>
                    </p:column>
                    <p:column headerText="Tipo" filterBy="#{obj.tipo}" >
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" style="width: 85%;" >
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{ubicacionBean.tipos}" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{obj.tipoStr}" title="#{obj.tipoStr}"/>
                    </p:column>
                    <p:column headerText="Padre"  filterBy="#{obj.ubicacionPadre.nombre}">
                        <f:facet name="filter">
                            <p:inputText label="Padre" maxlength="16" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.ubicacionPadre.nombre}" title="#{obj.ubicacionPadre.nombre}"/>
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{obj.nombre}" filterBy="#{obj.nombre}">
                        <f:facet name="filter">
                            <p:inputText label="Nombre" maxlength="16" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.nombre}" title="#{obj.nombre}"/>
                    </p:column>
                    <p:column headerText="F.H. Crea" sortBy="#{obj.fechaHoraCrea}">                        
                        <h:outputText value="#{obj.fechaHoraCrea}">
                            <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm:ss" timeZone="America/Bogota"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" style="left:25%"/>
                </p:confirmDialog>
            </h:form>

            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="boton-normal btn1" action="#{ubicacionBean.getAuditoria(ubicacionBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoria" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelVer" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor"
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Tipo"/>
                                    <p:outputLabel value="#{ubicacionBean.objeto.tipoStr}"/>
                                    <p:outputLabel value="Padre"/>
                                    <p:outputLabel value="#{ubicacionBean.objeto.ubicacionPadre.nombre}"/>
                                    <p:outputLabel value="Nombre" />
                                    <p:outputLabel value="#{ubicacionBean.objeto.nombre}"/>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton btn-salir"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Crear -->
            <p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form id="frmCrear">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrear" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelCrear" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Tipo" for="tipo"/>
                                    <p:selectOneMenu id="tipo" required="true" value="#{ubicacionBean.objeto.tipo}" style="width: 99%" >
                                        <p:ajax listener="#{ubicacionBean.cargaPadresTipo}" />
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{ubicacionBean.tipos}" />
                                    </p:selectOneMenu>
                                    <p:outputLabel value="Padre" for="padre"/>
                                    <p:autoComplete id="padre" value="#{ubicacionBean.objeto.ubicacionPadre}" converter="ubicacionConverter" completeMethod="#{ubicacionBean.completarPadre}" size="50" var="padre" itemLabel="#{padre.nombre}" itemValue="#{padre}" forceSelection="true"/>
                                    <p:outputLabel value="Nombre" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" style="width: 99%" maxlength="31" required="true" value="#{ubicacionBean.objeto.nombre}"/>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrear" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Guardar" type="button" class="boton btn-azul" onclick="guardarRemote()" validateClient="true" styleClass="btn-guardar"/>
                                        <p:remoteCommand name="guardarRemote" action ="#{ubicacionBean.guardar}" update="panelCrear" />
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoCrear').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Editar -->
            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmEditar">
                        <p:scrollPanel mode="native">
                            <p:panel id="pEditar" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelEditar" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    <p:outputLabel value="Tipo" for="tipo"/>
                                    <p:selectOneMenu id="tipo" required="true" value="#{ubicacionBean.objeto.tipo}" style="width: 99%" >
                                        <p:ajax listener="#{ubicacionBean.cargaPadresTipo}" />
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{ubicacionBean.tipos}" />
                                    </p:selectOneMenu>
                                    <p:outputLabel value="Padre" for="padre"/>
                                    <p:autoComplete id="padre" value="#{ubicacionBean.objeto.ubicacionPadre}" converter="ubicacionConverter" completeMethod="#{ubicacionBean.completarPadre}" style="width: 60%" var="padre" itemLabel="#{padre.nombre}" itemValue="#{padre}" forceSelection="true"/>
                                    <p:outputLabel value="Nombre" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" style="width: 99%" maxlength="31" required="true" value="#{ubicacionBean.objeto.nombre}"/>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesEditar" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Modificar" type="button" class="boton btn-azul"   onclick="modificarRemote()" validateClient="true" styleClass="btn-modificar" />
                                        <p:remoteCommand name="modificarRemote" action="#{ubicacionBean.modificar}" update="panelEditar" />
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoEditar').hide()" immediate="true" styleClass="btn-cancelar" />
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

        </center>
    </ui:define>
</ui:composition>
