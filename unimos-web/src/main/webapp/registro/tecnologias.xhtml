<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>        
        <center>

            <h:form id="frmTecnologias">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{tecnologiaBean.modulo.descripcion}">#{tecnologiaBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{tecnologiaBean.accionListar}" title="Refrescar" ajax="false" actionListener="#{tecnologiaBean.refrescar}" icon="pi pi-sync " class="boton-normal btn1"/>
                        <p:commandButton rendered="#{tecnologiaBean.accionCrear}" title="Crear" actionListener="#{tecnologiaBean.crear}" icon="pi pi-file-o" class="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaWidget" var="obj" value="#{tecnologiaBean.lazyTecnologia}" rowKey="#{obj.id}"
                             rows="#{tecnologiaBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros" >

                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>    
                        <p:commandButton rendered="#{tecnologiaBean.accionVer}" title="Ver" actionListener="#{tecnologiaBean.ver(obj.id)}" icon="pi pi-search"/>
                        <p:commandButton rendered="#{tecnologiaBean.accionEditar}" title="Editar" actionListener="#{tecnologiaBean.editar(obj.id)}" icon="pi pi-pencil" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{tecnologiaBean.accionBorrar}" title="Borrar" action="#{tecnologiaBean.borrar(obj.id)}" icon="pi pi-trash" class="boton-normal btn1">
                            <p:confirm header="Confirmación" message="Está seguro que desea eliminar?" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>                    
                    <p:column headerText="Tipo" filterBy="#{obj.tipo}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" >
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="Procedimiento" itemValue="1" />
                                <f:selectItem itemLabel="Medicamento" itemValue="2" />
                                <f:selectItem itemLabel="Insumo" itemValue="3" />
                                <f:selectItem itemLabel="Paquete" itemValue="4" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{obj.tipoStr}"/>
                    </p:column>
                    <p:column headerText="Código" sortBy="#{obj.codigo}" filterBy="#{obj.codigo}">
                        <f:facet name="filter">
                            <p:inputText label="Código" maxlength="16" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.codigo}"/>
                    </p:column>
                    <p:column headerText="Código Própio" sortBy="#{obj.codigoPropio}" filterBy="#{obj.codigoPropio}">
                        <f:facet name="filter">
                            <p:inputText label="Código Própio" maxlength="16" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.codigoPropio}"/>
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{obj.nombre}" filterBy="#{obj.nombre}">
                        <f:facet name="filter">
                            <p:inputText label="Nombre" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.nombre}" title="#{obj.descripcion}"/>
                    </p:column>
                    <p:column headerText="Servicio Habilitación" filterBy="#{obj.maeServicioHabilitacionId}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" filter="true" filterMatchMode="contains" style="width: 90%;">
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{tecnologiaBean.listaMaeServicioHabilitacion}" var="hab" itemValue="#{hab.id}"  itemLabel="#{hab.nombre}" itemDescription="#{hab.nombre}"/>
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText title="#{obj.maeServicioHabilitacionCodigo}" value="#{obj.maeServicioHabilitacionValor}"/>
                    </p:column>
                    <p:column headerText="Activo" filterBy="#{obj.activa}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaWidget').filter()" >
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItem itemLabel="SI" itemValue="true" />
                                <f:selectItem itemLabel="NO" itemValue="false" />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText title="#{obj.activaStr}" value="#{obj.activaStr}"/>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" style="left:25%"/>
                </p:confirmDialog>
            </h:form>

            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="boton-normal btn1" action="#{tecnologiaBean.getAuditoria(tecnologiaBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoria" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelVer" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor"
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo" style="font-weight:bold"/>
                                    <p:outputLabel value="#{tecnologiaBean.objeto.tipoStr}"/>
                                    <p:outputLabel value="Código" style="font-weight:bold"/>
                                    <p:outputLabel value="#{tecnologiaBean.objeto.codigo}"/>
                                    <p:outputLabel value="Código Própio" style="font-weight:bold"/>
                                    <p:outputLabel value="#{tecnologiaBean.objeto.codigoPropio}"/>                                    
                                    <p:outputLabel value="Nombre" style="font-weight:bold"/>
                                    <p:outputLabel value="#{tecnologiaBean.objeto.nombre}"/>
                                    <p:outputLabel value="Descripción" style="font-weight:bold"/>
                                    <p:outputLabel value="#{tecnologiaBean.objeto.descripcion}"/>
                                    <p:outputLabel value="Servicio Habiitación" style="font-weight:bold"/>
                                    <p:outputLabel title="#{tecnologiaBean.objeto.maeServicioHabilitacionCodigo}" value="#{tecnologiaBean.objeto.maeServicioHabilitacionValor}"/>
                                    <p:outputLabel value="Activo" style="font-weight:bold"/>
                                    <p:outputLabel value="#{tecnologiaBean.objeto.activaStr}"/>

                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton btn-salir"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Crear -->
            <!--<p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" width="80%">-->
            <p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form id="frmCrear">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrear" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelCrear" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo" style="font-weight:bold" for="tipo"/>
                                    <p:selectOneMenu id="tipo" label="Tipo" value="#{tecnologiaBean.objeto.tipo}" filter="true" filterMatchMode="contains" required="true" editable="fase">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItem itemLabel="Procedimiento" itemValue="1" />
                                        <f:selectItem itemLabel="Medicamento" itemValue="2" />
                                        <f:selectItem itemLabel="Insumo" itemValue="3" />
                                        <f:selectItem itemLabel="Paquete" itemValue="4" />
                                    </p:selectOneMenu>

                                    <p:outputLabel value="Código" style="font-weight:bold" for="codigo"/>
                                    <p:inputText id="codigo" label="Código" value="#{tecnologiaBean.objeto.codigo}" maxlength="16" required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Código Própio" style="font-weight:bold" for="codigoPropio"/>
                                    <p:inputText id="codigoPropio" label="Código Própio" value="#{tecnologiaBean.objeto.codigoPropio}" maxlength="16" required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Nombre" style="font-weight:bold" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" value="#{tecnologiaBean.objeto.nombre}" maxlength="128"  required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Descripción" style="font-weight:bold" for="descripcion"/>
                                    <p:inputTextarea id="descripcion" label="Descripción" value="#{tecnologiaBean.objeto.descripcion}" cols="50" maxlength="512"/>
                                    
                                    <p:outputLabel value="Servicio Habilitación" style="font-weight:bold" for="servicioHabilitacion"/>
                                    <p:selectOneMenu id="servicioHabilitacion" label="Servicio Habilitación" value="#{tecnologiaBean.objeto.maeServicioHabilitacionId}" filter="true" filterMatchMode="contains" required="true" editable="fase">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{tecnologiaBean.listaMaeServicioHabilitacion}" var="hab" itemValue="#{hab.id}"  itemLabel="#{hab.nombre}" itemDescription="#{hab.nombre}"/>
                                    </p:selectOneMenu>
                                    
                                    <p:outputLabel value="Activo" style="font-weight:bold" for="activo"/>
                                    <p:selectOneRadio id="activo" value="#{tecnologiaBean.objeto.activa}" required="true">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>

                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrear" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Guardar" type="button" onclick="guardarRemote()" validateClient="true" styleClass="btn-guardar"/>
                                        <p:remoteCommand name="guardarRemote" action ="#{tecnologiaBean.guardar}" update="panelCrear"/>
                                        <p:commandButton value="Cancelar" type="button" onclick="PF('dialogoCrear').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Editar -->
            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmEditar">
                        <p:scrollPanel mode="native">
                            <p:panel id="pEditar" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelEditar" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">
                                    
                                    <p:outputLabel value="Tipo" style="font-weight:bold" for="tipo"/>
                                    <p:selectOneMenu id="tipo" label="Tipo" value="#{tecnologiaBean.objeto.tipo}" filter="true" filterMatchMode="contains" required="true" editable="fase">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItem itemLabel="Procedimiento" itemValue="1" />
                                        <f:selectItem itemLabel="Medicamento" itemValue="2" />
                                        <f:selectItem itemLabel="Insumo" itemValue="3" />
                                        <f:selectItem itemLabel="Paquete" itemValue="4" />
                                    </p:selectOneMenu>

                                    <p:outputLabel value="Código" style="font-weight:bold" for="codigo"/>
                                    <p:inputText id="codigo" label="Código" value="#{tecnologiaBean.objeto.codigo}" maxlength="16" required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Código Própio" style="font-weight:bold" for="codigoPropio"/>
                                    <p:inputText id="codigoPropio" label="Código Própio" value="#{tecnologiaBean.objeto.codigoPropio}" maxlength="16" required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Nombre" style="font-weight:bold" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" value="#{tecnologiaBean.objeto.nombre}" maxlength="128" required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Descripción" style="font-weight:bold" for="descripcion"/>
                                    <p:inputTextarea id="descripcion" label="Descripción" value="#{tecnologiaBean.objeto.descripcion}" cols="50" maxlength="512"/>
                                    
                                    <p:outputLabel value="Servicio Habilitación" style="font-weight:bold" for="servicioHabilitacion"/>
                                    <p:selectOneMenu id="servicioHabilitacion" label="Servicio Habilitación" value="#{tecnologiaBean.objeto.maeServicioHabilitacionId}" filter="true" filterMatchMode="contains" required="true" editable="fase">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{tecnologiaBean.listaMaeServicioHabilitacion}" var="hab" itemValue="#{hab.id}"  itemLabel="#{hab.nombre}" itemDescription="#{hab.nombre}"/>
                                    </p:selectOneMenu>
                                    
                                    <p:outputLabel value="Activo" style="font-weight:bold" for="activo"/>
                                    <p:selectOneRadio id="activo" value="#{tecnologiaBean.objeto.activa}" required="true">
                                        <f:selectItem itemLabel="Si" itemValue="true" />
                                        <f:selectItem itemLabel="No" itemValue="false" />
                                    </p:selectOneRadio>
                                    
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesEditar" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Modificar" type="button" class="boton btn-azul"   onclick="modificarRemote()" validateClient="true" styleClass="btn-modificar" />
                                        <p:remoteCommand name="modificarRemote" action="#{tecnologiaBean.modificar}" update="panelEditar" />
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoEditar').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

        </center>
    </ui:define>
</ui:composition>
