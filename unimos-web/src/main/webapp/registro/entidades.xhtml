<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>        
        <center>

            <!-- Listar -->
            <h:form id="frmEntidades">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{entidadBean.modulo.descripcion}">#{entidadBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{entidadBean.accionListar}" title="Refrescar" ajax="false" actionListener="#{entidadBean.refrescar}" icon="pi pi-sync " styleClass="boton-normal btn1"/>
                        <p:commandButton rendered="#{entidadBean.accionCrear}" title="Crear" actionListener="#{entidadBean.crear}" icon="pi pi-file-o" styleClass="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaWidget" var="obj" value="#{entidadBean.lazyRegistros}" rowKey="#{obj.id}"
                             rows="#{entidadBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros" >
                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>    
                        <p:commandButton rendered="#{entidadBean.accionVer}" title="Ver" actionListener="#{entidadBean.ver(obj.id)}" icon="pi pi-search" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{entidadBean.accionEditar}" title="Editar" actionListener="#{entidadBean.editar(obj.id)}" icon="pi pi-pencil" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{entidadBean.accionBorrar}" title="Borrar" action="#{entidadBean.borrar(obj.id)}" icon="pi pi-trash" class="boton-normal btn1">
                            <p:confirm header="Confirmación" message="Está seguro que desea eliminar?" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>                    
                    <p:column headerText="Tipo" sortBy="#{obj.maeTipoValor}" filterBy="#{obj.maeTipoId}">
                        <f:facet name="filter">
                            <p:selectOneMenu onchange="PF('tablaRegistrosWidget').filter()" style="width: 99%">
                                <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{entidadBean.listaMaeTiposEntidad}" var="tipo" itemValue="#{tipo.id}"  itemLabel="#{tipo.nombre}" itemDescription="#{tipo.descripcion}"   />
                            </p:selectOneMenu>
                        </f:facet>
                        <h:outputText value="#{obj.maeTipoValor}"/>
                    </p:column>                    
                    <p:column headerText="Número Documento" sortBy="#{obj.nit}" filterBy="#{obj.nit}">
                        <f:facet name="filter">
                            <p:inputText label="NIT" maxlength="64" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.nit}"/>
                    </p:column>
                    <p:column headerText="Razón Social" sortBy="#{obj.razonSocial}" filterBy="#{obj.razonSocial}">
                        <f:facet name="filter">
                            <p:inputText label="Razón Social" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.razonSocial}"/>
                    </p:column>
                    <p:column headerText="Nombre Comercial" sortBy="#{obj.nombreComercial}" filterBy="#{obj.nombreComercial}">
                        <f:facet name="filter">
                            <p:inputText label="Nombre Comercial" maxlength="128" style="width: 95%;" onchange="PF('tablaWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.nombreComercial}"/>
                    </p:column>                    
                    <p:column headerText="Municipio" filterBy="#{obj.gnUbicacion.id}">
                        <f:facet name="filter">
                            <p:autoComplete label="Municipio" onchange="PF('tablaWidget').filter()" dropdown="false" completeMethod="#{entidadBean.completarUbicacion}"
                                            var="ubica" itemLabel="#{entidadBean.getUbicacionRecursiva(ubica.id)}" itemValue="#{ubica}" forceSelection="true" style="width: 95%;"> 
                            </p:autoComplete>
                        </f:facet>
                        <h:outputText value="#{entidadBean.getUbicacionRecursiva(obj.gnUbicacion.id)}"/>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" style="left:25%"/>
                </p:confirmDialog>
            </h:form>

            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="boton-normal btn1" action="#{entidadBean.getAuditoria(entidadBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoria" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelVer" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor"
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo Entidad" style="font-weight:bold"/>
                                    <p:outputLabel value="#{entidadBean.objeto.maeTipoValor}"/>

                                    <p:outputLabel value="NIT" style="font-weight:bold"/>
                                    <p:outputLabel value="#{entidadBean.objeto.nit}"/>

                                    <p:outputLabel value="Razón Social" style="font-weight:bold"/>
                                    <p:outputLabel value="#{entidadBean.objeto.razonSocial}"/>

                                    <p:outputLabel value="Nombre Comercial" style="font-weight:bold"/>
                                    <p:outputLabel value="#{entidadBean.objeto.nombreComercial}"/>

                                    <p:outputLabel value="Direccion" style="font-weight:bold"/>
                                    <p:outputLabel value="#{entidadBean.objeto.direccion}"/>

                                    <p:outputLabel value="Municipio" style="font-weight:bold"/>
                                    <p:outputLabel value="#{entidadBean.getUbicacionRecursiva(entidadBean.objeto.gnUbicacion.id)}"/>

                                </p:panelGrid>
                            </p:panel>
                            <p:panel id="pVer2" header="Contactos" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                
                                <p:panelGrid id="panelContactos" columns="1" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" >
                                    <p:dataTable id="tablaContactos" var="con" value="#{entidadBean.objeto.listaUnEntidadContactos}" rowKey="#{con.id}"
                                                 styleClass="tablaNueva" emptyMessage="No se encontraron registros" 
                                                 rowStyleClass="#{con.estadoRegistro == 2 ? 'fila-tachada' : null}">

                                        <p:column headerText="Tipo Contacto" sortBy="#{con.maeTipoValor}">
                                            <h:outputText value="#{con.maeTipoValor}"/>
                                        </p:column>
                                        <p:column headerText="Nombre" sortBy="#{con.nombre}">
                                            <h:outputText value="#{con.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Contacto" sortBy="#{con.contacto}">
                                            <h:outputText value="#{con.contacto}"/>
                                        </p:column>
                                        <p:column headerText="FH Crea" sortBy="#{con.fechaHoraCrea}">
                                            <h:outputText value="#{con.fechaHoraCrea}">
                                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" />
                                            </h:outputText>
                                        </p:column>

                                    </p:dataTable>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton btn-salir"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Crear -->
            <p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form id="frmCrear">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrear" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelCrear" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo Entidad" style="font-weight:bold" for="maeTipoEntidad"/>
                                    <p:selectOneMenu id="maeTipoEntidad" label="Tipo Entidad" value="#{entidadBean.objeto.maeTipoId}" required="true">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{entidadBean.listaMaeTiposEntidad}" var="tipoDocumento" itemValue="#{tipoDocumento.id}"  itemLabel="#{tipoDocumento.nombre}" itemDescription="#{tipoDocumento.descripcion}"/>
                                    </p:selectOneMenu>

                                    <p:outputLabel value="NIT" style="font-weight:bold" for="nit"/>
                                    <p:inputText id="nit" label="NIT" value="#{entidadBean.objeto.nit}" maxlength="16"  required="false">
                                    </p:inputText>

                                    <p:outputLabel value="Razón Social" style="font-weight:bold" for="razonSocial"/>
                                    <p:inputText id="razonSocial" label="Razón SOcial" value="#{entidadBean.objeto.razonSocial}" maxlength="256"  required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Nombre Comercial" style="font-weight:bold" for="nombreComercial"/>
                                    <p:inputText id="nombreComercial" label="Nombre Comercial" value="#{entidadBean.objeto.nombreComercial}" maxlength="128">
                                    </p:inputText>           

                                    <p:outputLabel value="Dirección" style="font-weight:bold" for="direccion"/>
                                    <p:inputText id="direccion" label="Dirección" value="#{entidadBean.objeto.direccion}" maxlength="256">
                                    </p:inputText>

                                    <p:outputLabel value="Municipio"  style="font-weight:bold" for="ubicacion"/>
                                    <p:autoComplete id="ubicacion" label="Municipio" dropdown="false" value="#{entidadBean.objeto.gnUbicacion}" completeMethod="#{entidadBean.completarUbicacion}"
                                                    var="ubica" itemLabel="#{entidadBean.getUbicacionRecursiva(ubica.id)}" itemValue="#{ubica}" converter="ubicacionConverterEntidad" forceSelection="true" required="true" requiredMessage="Municipio: Este campo es obligatorio"> 
                                    </p:autoComplete>

                                </p:panelGrid>
                            </p:panel>
                            <p:panel id="pCrear2" header="Contactos" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">

                                <div align="right"> 
                                    <p:commandButton immediate="true" action="#{entidadBean.contactoCrear}" icon="ui-icon-person" title="Suscriptor"/>
                                </div>
                                <p:panelGrid id="panelContactos" columns="1" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" >
                                    <p:dataTable id="tablaContactos" var="con" value="#{entidadBean.objeto.listaUnEntidadContactos}" rowKey="#{con.id}"
                                                 styleClass="tablaNueva" emptyMessage="No se encontraron registros" 
                                                 rowStyleClass="#{con.estadoRegistro == 2 ? 'fila-tachada' : null}">

                                        <p:column headerText="Tipo Contacto" sortBy="#{con.maeTipoValor}">
                                            <h:outputText value="#{con.maeTipoValor}"/>
                                        </p:column>
                                        <p:column headerText="Nombre" sortBy="#{con.nombre}">
                                            <h:outputText value="#{con.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Contacto" sortBy="#{con.contacto}">
                                            <h:outputText value="#{con.contacto}"/>
                                        </p:column>
                                        <p:column headerText="FH Crea" sortBy="#{con.fechaHoraCrea}">
                                            <h:outputText value="#{con.fechaHoraCrea}">
                                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" />
                                            </h:outputText>
                                        </p:column>                                        
                                        <p:column style="text-align: center;">
                                            <f:facet name="header">
                                                <h:outputText value="Acciones"/>
                                            </f:facet>                                            
                                            <p:commandButton title="Retirar" immediate="true" rendered="#{con.estadoRegistro == 1}" action="#{entidadBean.contactoRetirar(con)}" icon="pi pi-times" class="boton-normal btn1" />
                                            <p:commandButton title="Borrar" immediate="true" rendered="#{con.estadoRegistro == 0}" action="#{entidadBean.contactoBorrar(con.id)}" icon="pi pi-trash" class="boton-normal btn1" />
                                        </p:column>

                                    </p:dataTable>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrear" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Guardar" type="button" onclick="guardarRemote()" validateClient="true" styleClass="btn-guardar"/>
                                        <p:remoteCommand name="guardarRemote" action ="#{entidadBean.guardar}" update="panelCrear"/>
                                        <p:commandButton value="Cancelar" type="button" onclick="PF('dialogoCrear').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Editar -->
            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmEditar">
                        <p:scrollPanel mode="native">
                            <p:panel id="pEditar" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelEditar" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo Entidad" style="font-weight:bold" for="maeTipoEntidad"/>
                                    <p:selectOneMenu id="maeTipoEntidad" label="Tipo Entidad" value="#{entidadBean.objeto.maeTipoId}" required="true">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{entidadBean.listaMaeTiposEntidad}" var="tipoDocumento" itemValue="#{tipoDocumento.id}"  itemLabel="#{tipoDocumento.nombre}" itemDescription="#{tipoDocumento.descripcion}"/>
                                    </p:selectOneMenu>

                                    <p:outputLabel value="NIT" style="font-weight:bold" for="nit"/>
                                    <p:inputText id="nit" label="NIT" value="#{entidadBean.objeto.nit}" maxlength="16"  required="false">
                                    </p:inputText>

                                    <p:outputLabel value="Razón Social" style="font-weight:bold" for="razonSocial"/>
                                    <p:inputText id="razonSocial" label="Razón SOcial" value="#{entidadBean.objeto.razonSocial}" maxlength="256"  required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Nombre Comercial" style="font-weight:bold" for="nombreComercial"/>
                                    <p:inputText id="nombreComercial" label="Nombre Comercial" value="#{entidadBean.objeto.nombreComercial}" maxlength="128">
                                    </p:inputText>           

                                    <p:outputLabel value="Dirección" style="font-weight:bold" for="direccion"/>
                                    <p:inputText id="direccion" label="Dirección" value="#{entidadBean.objeto.direccion}" maxlength="256">
                                    </p:inputText>

                                    <p:outputLabel value="Municipio"  style="font-weight:bold" for="ubicacion"/>
                                    <p:autoComplete id="ubicacion" label="Municipio" dropdown="false" value="#{entidadBean.objeto.gnUbicacion}" completeMethod="#{entidadBean.completarUbicacion}"
                                                    var="ubica" itemLabel="#{entidadBean.getUbicacionRecursiva(ubica.id)}" itemValue="#{ubica}" converter="ubicacionConverterEntidad" forceSelection="true" required="true" requiredMessage="Municipio: Este campo es obligatorio"> 
                                    </p:autoComplete>

                                </p:panelGrid>
                            </p:panel>
                            <p:panel id="pEditar2" header="Contactos" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">

                                <div align="right"> 
                                    <p:commandButton immediate="true" action="#{entidadBean.contactoCrear}" icon="ui-icon-person" title="Suscriptor"/>
                                </div>
                                <p:panelGrid id="panelContactos" columns="1" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" >
                                    <p:dataTable id="tablaContactos" var="con" value="#{entidadBean.objeto.listaUnEntidadContactos}" rowKey="#{con.id}"
                                                 styleClass="tablaNueva" emptyMessage="No se encontraron registros" 
                                                 rowStyleClass="#{con.estadoRegistro == 2 ? 'fila-tachada' : null}">

                                        <p:column headerText="Tipo Contacto" sortBy="#{con.maeTipoValor}">
                                            <h:outputText value="#{con.maeTipoValor}"/>
                                        </p:column>
                                        <p:column headerText="Nombre" sortBy="#{con.nombre}">
                                            <h:outputText value="#{con.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Contacto" sortBy="#{con.contacto}">
                                            <h:outputText value="#{con.contacto}"/>
                                        </p:column>
                                        <p:column headerText="FH Crea" sortBy="#{con.fechaHoraCrea}">
                                            <h:outputText value="#{con.fechaHoraCrea}">
                                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" />
                                            </h:outputText>
                                        </p:column>                                        
                                        <p:column style="text-align: center;">
                                            <f:facet name="header">
                                                <h:outputText value="Acciones"/>
                                            </f:facet>                                            
                                            <p:commandButton title="Retirar" immediate="true" rendered="#{con.estadoRegistro == 1}" action="#{entidadBean.contactoRetirar(con)}" icon="pi pi-times" class="boton-normal btn1" />
                                            <p:commandButton title="Borrar" immediate="true" rendered="#{con.estadoRegistro == 0}" action="#{entidadBean.contactoBorrar(con.id)}" icon="pi pi-trash" class="boton-normal btn1" />
                                        </p:column>

                                    </p:dataTable>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesEditar" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Modificar" type="button" class="boton btn-azul"   onclick="modificarRemote()" validateClient="true" styleClass="btn-modificar" />
                                        <p:remoteCommand name="modificarRemote" action="#{entidadBean.modificar}" update="panelEditar" />
                                        <p:commandButton value="Cancelar" type="button" class="boton btn-rojo" onclick="PF('dialogoEditar').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Crear Contacto-->
            <p:dialog header="Crear Contacto" widgetVar="dialogoCrearContacto" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form id="frmCrearContacto">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrearContacto" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelCrearContacto" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo Contacto" style="font-weight:bold" for="maeTipoContacto"/>
                                    <p:selectOneMenu id="maeTipoContacto" label="Tipo Contacto" value="#{entidadBean.objetoContacto.maeTipoId}" required="true">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{entidadBean.listaMaeTiposContacto}" var="tipoContacto" itemValue="#{tipoContacto.id}"  itemLabel="#{tipoContacto.nombre}" itemDescription="#{tipoContacto.descripcion}"/>
                                    </p:selectOneMenu>

                                    <p:outputLabel value="Nombre" style="font-weight:bold" for="nombre"/>
                                    <p:inputText id="nombre" label="Nombre" value="#{entidadBean.objetoContacto.nombre}" maxlength="156"  required="true">
                                    </p:inputText>

                                    <p:outputLabel value="Contacto" style="font-weight:bold" for="contacto"/>
                                    <p:inputText id="contacto" label="Contacto" value="#{entidadBean.objetoContacto.contacto}" maxlength="156"  required="true">
                                    </p:inputText>

                                </p:panelGrid>
                            </p:panel>                            
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrearContacto" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Agregar" type="button" onclick="agregarContactoRemote()" validateClient="true" styleClass="btn-guardar"/>
                                        <p:remoteCommand name="agregarContactoRemote" action ="#{entidadBean.contactoAgregar}" update="panelCrearContacto"/>
                                        <p:commandButton value="Cancelar" type="button" onclick="PF('dialogoCrearContacto').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

        </center>
    </ui:define>
</ui:composition>
