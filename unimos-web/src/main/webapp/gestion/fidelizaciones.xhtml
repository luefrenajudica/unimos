<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<ui:composition template="/home.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="bodyJR">
        <h:outputStylesheet name="css/modulo.css"/>        
        <center>

            <!-- Listar -->
            <h:form id="frmFidelizaciones">
                <p:toolbar>
                    <f:facet name="left" >
                        <span title="#{fidelizacionBean.modulo.descripcion}">#{fidelizacionBean.modulo.nombre}</span>
                    </f:facet>
                    <f:facet name="right">
                        <p:commandButton rendered="#{fidelizacionBean.accionListar}" title="Refrescar" ajax="false" actionListener="#{fidelizacionBean.refrescar}" icon="pi pi-sync " styleClass="boton-normal btn1"/>
                        <p:commandButton rendered="#{fidelizacionBean.accionCrear}" title="Crear" actionListener="#{fidelizacionBean.crear}" icon="pi pi-file-o" styleClass="boton-normal btn1"/>
                    </f:facet>
                </p:toolbar>
                <p:dataTable id="tablaRegistros" widgetVar="tablaRegistrosWidget" var="obj" value="#{fidelizacionBean.lazyRegistros}" rowKey="#{obj.id}"
                             rows="#{fidelizacionBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                             currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,30,50,100" 
                             emptyMessage="No se encontraron registros" >
                    <p:column style="text-align: center;">
                        <f:facet name="header">
                            <h:outputText value="Acciones"/>
                        </f:facet>    
                        <p:commandButton rendered="#{fidelizacionBean.accionVer}" title="Ver" actionListener="#{fidelizacionBean.ver(obj.id)}" icon="pi pi-search" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{fidelizacionBean.accionEditar}" title="Editar" actionListener="#{fidelizacionBean.editar(obj.id)}" icon="pi pi-pencil" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{fidelizacionBean.accionAdicional1 and obj.estado != 2}" title="Gestionar" actionListener="#{fidelizacionBean.gestionar(obj.id)}" icon="pi pi-list-check" class="boton-normal btn1"/>
                        <p:commandButton rendered="#{fidelizacionBean.accionBorrar}" title="Borrar" action="#{fidelizacionBean.borrar(obj.id)}" icon="pi pi-trash" class="boton-normal btn1">
                            <p:confirm header="Confirmación" message="Está seguro que desea eliminar?" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>

                    <p:column headerText="ID" sortBy="#{obj.id}" filterBy="#{obj.id}">
                        <f:facet name="filter">
                            <p:inputText label="ID" maxlength="11" style="width: 95%;" onchange="PF('tablaRegistrosWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.id}"/>
                    </p:column>

                    <p:column headerText="Tipo Documento">
                        <h:outputText value="#{obj.unPersona.maeTipoDocumentoCodigo}" title="#{obj.unPersona.maeTipoDocumentoValor}"/>
                    </p:column>
                    <p:column headerText="Número Documento" sortBy="#{obj.unPersona.documentoNumero}" filterBy="#{obj.unPersona.documentoNumero}">
                        <f:facet name="filter">
                            <p:inputText label="Número Documento" maxlength="64" style="width: 95%;" onchange="PF('tablaRegistrosWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.unPersona.documentoNumero}"/>
                    </p:column>
                    <p:column headerText="Primer Nombre" sortBy="#{obj.unPersona.primerNombre}" filterBy="#{obj.unPersona.primerNombre}">
                        <f:facet name="filter">
                            <p:inputText label="Primer Nombre" maxlength="64" style="width: 95%;" onchange="PF('tablaRegistrosWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.unPersona.primerNombre}"/>
                    </p:column>
                    <p:column headerText="Segundo Nombre" filterBy="#{obj.unPersona.segundoNombre}">
                        <f:facet name="filter">
                            <p:inputText label="Segundo Nombre" maxlength="64" style="width: 95%;" onchange="PF('tablaRegistrosWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.unPersona.segundoNombre}"/>
                    </p:column>
                    <p:column headerText="Primer Apellido" sortBy="#{obj.unPersona.primerApellido}" filterBy="#{obj.unPersona.primerApellido}">
                        <f:facet name="filter">
                            <p:inputText label="Primer Apellido" maxlength="64" style="width: 95%;" onchange="PF('tablaRegistrosWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.unPersona.primerApellido}"/>
                    </p:column>
                    <p:column headerText="Segundo Apellido" filterBy="#{obj.unPersona.segundoApellido}">
                        <f:facet name="filter">
                            <p:inputText label="Segundo Apellido" maxlength="64" style="width: 95%;" onchange="PF('tablaRegistrosWidget').filter()"/>
                        </f:facet>
                        <h:outputText value="#{obj.unPersona.segundoApellido}"/>
                    </p:column>                    
                    <p:column headerText="Estado" filterBy="#{obj.estado}">
                        <f:facet name="filter">
                            <f:facet name="filter">
                                <p:selectOneMenu onchange="PF('tablaRegistrosWidget').filter()" >
                                    <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItem itemLabel="Programado" itemValue="0" />
                                    <f:selectItem itemLabel="En Ejecución" itemValue="1" />
                                    <f:selectItem itemLabel="Finalizado" itemValue="2" />
                                </p:selectOneMenu>
                            </f:facet>
                        </f:facet>
                        <h:outputText value="#{obj.estadoStr}"/>
                    </p:column>

                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" style="left:25%"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" style="left:25%"/>
                </p:confirmDialog>
            </h:form>

            <!-- Ver -->
            <p:dialog header="Ver" widgetVar="dialogoVer" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form class="frmAuditoria" style="text-align: right;">
                        <p:commandButton id="auditoria" class="boton-normal btn1" action="#{fidelizacionBean.getAuditoria(fidelizacionBean.objeto.auditoriaStrHTML)}" icon="pi pi-comment" title="Auditoria" />
                    </h:form>
                    <h:form id="frmVer">
                        <p:scrollPanel mode="native">
                            <p:panel id="pVer1" header="Información Suscriptor" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelPersona" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo Documento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.maeTipoDocumentoValor}"/>

                                    <p:outputLabel value="Número Documento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.documentoNumero}"/>

                                    <p:outputLabel value="Primer Nombre"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.primerNombre}"/>

                                    <p:outputLabel value="Segundo Nombre"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.segundoNombre}"/>

                                    <p:outputLabel value="Primer Apellido"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.primerApellido}"/>

                                    <p:outputLabel value="Segundo Apellido"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.segundoApellido}"/>

                                    <p:outputLabel value="Género"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.maeSexoValor}"/>

                                    <p:outputLabel value="Estado Civil"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.maeEstadoCivilValor}"/>

                                    <p:outputLabel value="Dirección Residencia"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.direccion}"/>

                                    <p:outputLabel value="Fecha Nacimiento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.fechaNacimiento}">
                                        <f:convertDateTime pattern="yyyy-MM-dd" />
                                    </p:outputLabel>

                                    <p:outputLabel value="Susc. ID"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.id}"/>

                                    <p:outputLabel value="Susc. Plan"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.maePlanValor}"/>

                                    <p:outputLabel value="Susc. Tipo"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.maeTipoValor}"/>

                                    <p:outputLabel value="Susc. Titular"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.titularStr}"/>

                                    <p:outputLabel value="Susc. Fecha Inicio"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.fechaInicio}">
                                        <f:convertDateTime pattern="yyyy-MM-dd" />
                                    </p:outputLabel>

                                    <p:outputLabel value="Susc. Fecha Fin"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.fechaFin}">
                                        <f:convertDateTime pattern="yyyy-MM-dd" />
                                    </p:outputLabel>

                                </p:panelGrid>
                            </p:panel>
                            <p:panel id="pVer2" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">

                                <p:panelGrid id="panelVer2" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="ID"/>
                                    <p:outputLabel value="AUTO"/>

                                    <p:outputLabel value="Valor Suscriptor"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.valorSuscriptor}">
                                        <f:convertNumber pattern="$ #,##0.00"/>
                                    </p:outputLabel>

                                    <p:outputLabel value="Estado"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.estadoStr}"/>

                                </p:panelGrid>
                            </p:panel>
                            <p:panel id="pVer3" header="Servicios" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelFidelizacionTecnologia" columns="1" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" >
                                    <p:dataTable id="tablaFidelizacionTecnologias" var="serv" value="#{fidelizacionBean.objeto.listaUnFidelizacionTecnologias}" rowKey="#{ser.id}"
                                                 styleClass="tablaNueva" emptyMessage="No se encontraron registros" >

                                        <p:column headerText="Servicio Código">
                                            <h:outputText value="#{serv.unTecnologia.codigo}"/>
                                        </p:column>
                                        <p:column headerText="Servicio Código Própio">
                                            <h:outputText value="#{serv.unTecnologia.codigoPropio}"/>
                                        </p:column>
                                        <p:column headerText="Servicio Nombre">
                                            <h:outputText value="#{serv.unTecnologia.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Entidad NIT">
                                            <h:outputText value="#{serv.unEntidad.nit}"/>
                                        </p:column>
                                        <p:column headerText="Entidad Nombre">
                                            <h:outputText value="#{serv.unEntidad.nombreComercial}" title="#{serv.unEntidad.razonSocial}"/>
                                        </p:column>
                                        <p:column headerText="Contrato">
                                            <h:outputText value="#{serv.unContrato.contrato}"/>
                                        </p:column>
                                        <p:column headerText="Fecha" sortBy="#{serv.fecha}">
                                            <h:outputText value="#{serv.fecha}">
                                                <f:convertDateTime pattern="yyyy-MM-dd" />
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="Hora">
                                            <h:outputText value="#{serv.hora}">
                                                <f:convertDateTime pattern="HH:mm" />
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="Estado">
                                            <h:outputText value="#{serv.estadoStr}"/>
                                        </p:column>

                                        <p:column style="text-align: center;">
                                            <f:facet name="header">
                                                <h:outputText value="Acciones"/>
                                            </f:facet>                                            
                                            <p:commandButton rendered="#{fidelizacionBean.accionVer}" title="Ver" immediate="true" action="#{fidelizacionBean.fidelizacionTecnologiaVer(serv)}" icon="pi pi-search" class="boton-normal btn1" />
                                        </p:column>

                                    </p:dataTable>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesVer" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Salir" type="button" onclick="PF('dialogoVer').hide()" immediate="true" styleClass="boton btn-salir"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Crear -->
            <p:dialog header="Crear" widgetVar="dialogoCrear" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >
                    <h:form id="frmCrear">
                        <p:scrollPanel mode="native">
                            <p:panel id="pCrear1" header="Suscriptor" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <div align="right"> 
                                    <p:commandButton rendered="#{fidelizacionBean.accionCrear}" immediate="true" action="#{fidelizacionBean.listarPersonas}" icon="ui-icon-person" title="Suscriptor"/>
                                </div>
                                <p:panelGrid id="panelPersona" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo Documento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.maeTipoDocumentoValor}"/>

                                    <p:outputLabel value="Número Documento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.documentoNumero}"/>

                                    <p:outputLabel value="Primer Nombre"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.primerNombre}"/>

                                    <p:outputLabel value="Segundo Nombre"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.segundoNombre}"/>

                                    <p:outputLabel value="Primer Apellido"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.primerApellido}"/>

                                    <p:outputLabel value="Segundo Apellido"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.segundoApellido}"/>

                                    <p:outputLabel value="Género"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.maeSexoValor}"/>

                                    <p:outputLabel value="Estado Civil"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.maeEstadoCivilValor}"/>

                                    <p:outputLabel value="Dirección Residencia"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.direccion}"/>

                                    <p:outputLabel value="Fecha Nacimiento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.fechaNacimiento}">
                                        <f:convertDateTime pattern="yyyy-MM-dd" />
                                    </p:outputLabel>

                                    <p:outputLabel value="Susc. ID"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.id}"/>

                                    <p:outputLabel value="Susc. Plan"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.maePlanValor}"/>

                                    <p:outputLabel value="Susc. Tipo"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.maeTipoValor}"/>

                                    <p:outputLabel value="Susc. Titular"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.titularStr}"/>

                                    <p:outputLabel value="Susc. Fecha Inicio"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.fechaInicio}">
                                        <f:convertDateTime pattern="yyyy-MM-dd" />
                                    </p:outputLabel>

                                    <p:outputLabel value="Susc. Fecha Fin"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unSuscripcion.fechaFin}">
                                        <f:convertDateTime pattern="yyyy-MM-dd" />
                                    </p:outputLabel>

                                </p:panelGrid>
                            </p:panel>
                            <p:panel id="pCrear2" header="Información General" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">

                                <p:panelGrid id="panelCrear2" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="ID"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.id}"/>

                                    <p:outputLabel value="Valor Suscriptor"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.valorSuscriptor}">
                                        <f:convertNumber pattern="$ #,##0.00"/>
                                    </p:outputLabel>

                                    <p:outputLabel value="Estado"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.estadoStr}"/>

                                </p:panelGrid>
                            </p:panel>
                            <p:panel id="pCrear3" header="Servicios" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">

                                <div align="right"> 
                                    <p:commandButton rendered="#{fidelizacionBean.accionCrear}" immediate="true" action="#{fidelizacionBean.fidelizacionTecnologiaCrear}" icon="pi pi-cog" title="Agregar Servicio"/>
                                </div>
                                <p:panelGrid id="panelFidelizacionTecnologia" columns="1" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" >
                                    <p:dataTable id="tablaFidelizacionTecnologias" var="serv" value="#{fidelizacionBean.objeto.listaUnFidelizacionTecnologias}" rowKey="#{ser.id}"
                                                 styleClass="tablaNueva" emptyMessage="No se encontraron registros" >

                                        <p:column headerText="Servicio Código">
                                            <h:outputText value="#{serv.unTecnologia.codigo}"/>
                                        </p:column>
                                        <p:column headerText="Servicio Código Própio">
                                            <h:outputText value="#{serv.unTecnologia.codigoPropio}"/>
                                        </p:column>
                                        <p:column headerText="Servicio Nombre">
                                            <h:outputText value="#{serv.unTecnologia.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Entidad NIT">
                                            <h:outputText value="#{serv.unEntidad.nit}"/>
                                        </p:column>
                                        <p:column headerText="Entidad Nombre">
                                            <h:outputText value="#{serv.unEntidad.nombreComercial}" title="#{serv.unEntidad.razonSocial}"/>
                                        </p:column>
                                        <p:column headerText="Contrato">
                                            <h:outputText value="#{serv.unContrato.contrato}"/>
                                        </p:column>
                                        <p:column headerText="Fecha" sortBy="#{serv.fecha}">
                                            <h:outputText value="#{serv.fecha}">
                                                <f:convertDateTime pattern="yyyy-MM-dd" />
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="Hora">
                                            <h:outputText value="#{serv.hora}">
                                                <f:convertDateTime pattern="HH:mm" />
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="Estado">
                                            <h:outputText value="#{serv.estadoStr}"/>
                                        </p:column>

                                        <p:column style="text-align: center;">
                                            <f:facet name="header">
                                                <h:outputText value="Acciones"/>
                                            </f:facet>                                            
                                            <p:commandButton rendered="#{fidelizacionBean.accionCrear}" title="Borrar" immediate="true" action="#{fidelizacionBean.fidelizacionTecnologiaBorrar(serv.id)}" icon="pi pi-trash" class="boton-normal btn1" />
                                        </p:column>

                                    </p:dataTable>
                                </p:panelGrid>
                            </p:panel>
                        </p:scrollPanel>
                        <p:panelGrid id="panelAccionesCrear" class="footerdialog">
                            <f:facet name="footer">
                                <p:row>
                                    <p:column colspan="4" style="text-align: center">
                                        <p:commandButton value="Guardar" type="button" onclick="guardarRemote()" validateClient="true" styleClass="btn-guardar"/>
                                        <p:remoteCommand name="guardarRemote" action ="#{fidelizacionBean.guardar}" update="frmCrear"/>
                                        <p:commandButton value="Cancelar" type="button" onclick="PF('dialogoCrear').hide()" immediate="true" styleClass="btn-cancelar"/>
                                    </p:column>
                                </p:row>
                            </f:facet>
                        </p:panelGrid>
                    </h:form>
                </div>
            </p:dialog>

            <!-- Editar -->
            <p:dialog header="Editar" widgetVar="dialogoEditar" appendTo="@(body)" modal="true" 
                      draggable="true" resizable="true" closable="true" closeOnEscape="true"
                      styleClass="medioscreen-dialog" responsive="true" fitViewport="true" showEffect="fade">
                <div class="bodyDialog" >    
                    <h:form id="frmEditar">
                        <p:scrollPanel mode="native">
                            <p:panel id="pEditar1" header="Suscriptor" style="margin-bottom:10px; padding-bottom: 0.4rem;" collapsed="false" toggleable="true">
                                <p:panelGrid id="panelPersona" columns="4" layout="grid" 
                                             styleClass="ui-panelgrid-blank ui-fluid grid-bicolor" 
                                             columnClasses="ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo, ui-grid-col-2 col-etiqueta, ui-grid-col-4 col-campo">

                                    <p:outputLabel value="Tipo Documento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.maeTipoDocumentoValor}"/>

                                    <p:outputLabel value="Número Documento"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.documentoNumero}"/>

                                    <p:outputLabel value="Primer Nombre"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.primerNombre}"/>

                                    <p:outputLabel value="Segundo Nombre"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.segundoNombre}"/>

                                    <p:outputLabel value="Primer Apellido"/>
                                    <p:outputLabel value="#{fidelizacionBean.objeto.unPersona.primerApellido}"/>

                                    <p:outputLabel value="Segundo Apellido"/>

                                     rows="#{fidelizacionBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                                     currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="5,10,30,50,100" 
                                     emptyMessage="No se encontraron registros" selectionMode="single">
                            <p:ajax event="rowSelect" listener="#{fidelizacionBean.onRowPersonaSelect}" />

                            <p:column headerText="Tipo Documento">
                                <h:outputText value="#{per.maeTipoDocumentoValor}"/>
                            </p:column>
                            <p:column headerText="Documento" sortBy="#{per.documentoNumero}" filterBy="#{per.documentoNumero}">
                                <f:facet name="filter">
                                    <p:inputText label="Documento" maxlength="16" style="width: 95%;" onchange="PF('tablaPersonasWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{per.documentoNumero}"/>
                            </p:column>
                            <p:column headerText="Primer Nombre" sortBy="#{per.primerNombre}" filterBy="#{per.primerNombre}">
                                <f:facet name="filter">
                                    <p:inputText label="Primer Nombre" maxlength="64" style="width: 95%;" onchange="PF('tablaPersonasWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{per.primerNombre}"/>
                            </p:column>
                            <p:column headerText="Segundo Nombre" sortBy="#{per.segundoNombre}" filterBy="#{per.segundoNombre}">
                                <f:facet name="filter">
                                    <p:inputText label="Segundo Nombre" maxlength="64" style="width: 95%;" onchange="PF('tablaPersonasWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{per.segundoNombre}"/>
                            </p:column>
                            <p:column headerText="Primer Apellido" sortBy="#{per.primerApellido}" filterBy="#{per.primerApellido}">
                                <f:facet name="filter">
                                    <p:inputText label="Priemer Apellido" maxlength="64" style="width: 95%;" onchange="PF('tablaPersonasWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{per.primerApellido}"/>
                            </p:column>
                            <p:column headerText="Segundo Apellido" sortBy="#{per.segundoApellido}" filterBy="#{per.segundoApellido}">
                                <f:facet name="filter">
                                    <p:inputText label="Segundo Apellido" maxlength="64" style="width: 95%;" onchange="PF('tablaPersonasWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{per.segundoApellido}"/>
                            </p:column>
                            <p:column headerText="Suscripción ID" sortBy="#{per.unSuscripcion.id}" filterBy="#{per.unSuscripcion.id}">
                                <f:facet name="filter">
                                    <p:inputText label="Suscripción ID" maxlength="8" style="width: 95%;" onchange="PF('tablaPersonasWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{per.unSuscripcion.id}"/>
                            </p:column>
                            <p:column headerText="Suscripción Tipo" sortBy="#{per.unSuscripcion.maeTipoValor}" filterBy="#{per.unSuscripcion.maeTipoValor}">
                                <f:facet name="filter">
                                    <p:selectOneMenu onchange="PF('tablaPersonasWidget').filter()" style="width: 99%">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{fidelizacionBean.listaMaeTiposSuscripcion}" var="tipo" itemValue="#{tipo.id}"  itemLabel="#{tipo.nombre}" itemDescription="#{tipo.descripcion}"   />
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{per.unSuscripcion.maeTipoValor}"/>
                            </p:column>
                            <p:column headerText="Suscripción Plan" sortBy="#{per.unSuscripcion.maePlanValor}" filterBy="#{per.unSuscripcion.maePlanValor}">
                                <f:facet name="filter">
                                    <p:selectOneMenu onchange="PF('tablaPersonasWidget').filter()" style="width: 99%">
                                        <f:selectItem itemLabel=" -- " itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{fidelizacionBean.listaMaePlanes}" var="plan" itemValue="#{plan.id}"  itemLabel="#{plan.nombre}" itemDescription="#{plan.descripcion}"   />
                                    </p:selectOneMenu>
                                </f:facet>
                                <h:outputText value="#{per.unSuscripcion.maePlanValor}"/>
                            </p:column>
                            <p:column headerText="Suscripción Titular">
                                <h:outputText value="#{per.unSuscripcion.titularStr}"/>
                            </p:column>
                            <p:column headerText="Suscripción F.Inicio">
                                <h:outputText value="#{per.unSuscripcion.fechaInicio}">
                                    <f:convertDateTime pattern="yyyy-MM-dd" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Suscripción F.Fin">
                                <h:outputText value="#{per.unSuscripcion.fechaFin}">
                                    <f:convertDateTime pattern="yyyy-MM-dd" />
                                </h:outputText>
                            </p:column>
                        </p:dataTable>     
                    </p:scrollPanel>
                </h:form>
            </p:dialog>

            <!-- Consultar Contrato Detalles -->            
            <p:dialog header="Consultar Tecnologías Contratadas" widgetVar="dialogoContratoDetallesListar" appendTo="@(body)" modal="true" style="max-width: 90%; max-height: 90%;" dynamic="true" onShow="PF('tablaContratoDetallesWidget').filter()" onHide="asignarContratoDetalle()">
                <h:form id="frmContratoDetallesListar">
                    <div align="right">
                        <p:commandButton rendered="#{fidelizacionBean.accionCrear}" title="Refrescar" actionListener="#{fidelizacionBean.refrescarContratoDetalle()}" oncomplete="PF('tablaContratoDetallesWidget').filter()" icon="pi pi-sync " class="boton-normal btn1"/>
                    </div>
                    <p:scrollPanel mode="native" style="max-height: 550px;">
                        <p:dataTable id="tablaRegistros" widgetVar="tablaContratoDetallesWidget" var="conDet" value="#{fidelizacionBean.lazyContratoDetalles}" rowKey="#{conDet.id}"
                                     rows="#{fidelizacionBean.tamanoPagina}" paginator="true" lazy="true" reflow="true" styleClass="tablaNueva"
                                     currentPageReportTemplate="Registros del {startRecord} al {endRecord} de {totalRecords}, Página {currentPage} de {totalPages}"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="5,10,30,50,100" 
                                     emptyMessage="No se encontraron registros" selectionMode="single">
                            <p:ajax event="rowSelect" listener="#{fidelizacionBean.onRowContratoDetalleSelect}" />

                            <p:column headerText="Servicio Tipo" filterBy="#{conDet.unTecnologia.tipoStr}">
                                <h:outputText value="#{conDet.unTecnologia.tipoStr}"/>
                            </p:column>
                            <p:column headerText="Servicio Código" filterBy="#{conDet.unTecnologia.codigo}">
                                <f:facet name="filter">
                                    <p:inputText label="Servicio Código" maxlength="8" style="width: 95%;" onchange="PF('tablaContratoDetallesWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{conDet.unTecnologia.codigo}"/>
                            </p:column>
                            <p:column headerText="Servicio Código Propio" filterBy="#{conDet.unTecnologia.codigoPropio}">
                                <f:facet name="filter">
                                    <p:inputText label="Servicio Código Propio" maxlength="8" style="width: 95%;" onchange="PF('tablaContratoDetallesWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{conDet.unTecnologia.codigoPropio}"/>
                            </p:column>
                            <p:column headerText="Servicio Nombre" filterBy="#{conDet.unTecnologia.nombre}">
                                <f:facet name="filter">
                                    <p:inputText label="Servicio Nombre" maxlength="64" style="width: 95%;" onchange="PF('tablaContratoDetallesWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{conDet.unTecnologia.nombre}" title="#{conDet.unTecnologia.descripcion}"/>
                            </p:column>

                            <p:column headerText="Entidad Nit" filterBy="#{conDet.unContrato.unEntidad.nit}">
                                <f:facet name="filter">
                                    <p:inputText label="Entidad Nit" maxlength="16" style="width: 95%;" onchange="PF('tablaContratoDetallesWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{conDet.unContrato.unEntidad.nit}"/>
                            </p:column>                            
                            <p:column headerText="Entidad Nombre" filterBy="#{conDet.unContrato.unEntidad.nombreComercial}">
                                <f:facet name="filter">
                                    <p:inputText label="Entidad Nombre" maxlength="16" style="width: 95%;" onchange="PF('tablaContratoDetallesWidget').filter()"/>
                                </f:facet>
                                <h:outputText value="#{conDet.unContrato.unEntidad.nombreComercial}" title="#{conDet.unContrato.unEntidad.razonSocial}"/>
                            </p:column>

                            <p:column headerText="Fecha Inicio">
                                <h:outputText value="#{conDet.fechaInicio}">
                                    <f:convertDateTime pattern="yyyy-MM-dd" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Fecha Fin">
                                <h:outputText value="#{conDet.fechaFin}">
                                    <f:convertDateTime pattern="yyyy-MM-dd" />
                                </h:outputText>
                            </p:column>

                        </p:dataTable>     
                    </p:scrollPanel>
                </h:form>
            </p:dialog>

        </center>
    </ui:define>
</ui:composition>
